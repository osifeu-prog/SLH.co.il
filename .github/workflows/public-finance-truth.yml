name: Public Homepage Truth Guard

on:
  pull_request:
    paths:
      - "public/index.html"
      - "public/js/shared.js"
      - "public/status.html"
      - "public/disclosure.html"
      - "public/treasury-health.html"
      - "public/chain-status.html"
      - "tests/test_public_finance_truth.py"
      - ".github/workflows/public-finance-truth.yml"
  push:
    branches: [main]
    paths:
      - "public/index.html"
      - "public/js/shared.js"
      - "public/status.html"
      - "public/disclosure.html"
      - "public/treasury-health.html"
      - "public/chain-status.html"
      - "tests/test_public_finance_truth.py"
      - ".github/workflows/public-finance-truth.yml"

jobs:
  public-homepage-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test public financial claims and canonical status
        run: python -m unittest discover -s tests -p "test_public_finance_truth.py"
